version: 2
# Only GitHub Actions are updated by Dependabot. No "maven" and no "docker" ecosystem on purpose:
# pom.xml declares no versions (they are pinned in test-framework-parent of the test-framework repository),
# and the JDK of the base image must match the Java version of test-framework-parent and the exercises.
# Dependabot PRs must never be auto-merged.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "Dependency"
      include: "scope"
